---
zabbix_agent_release: "7.0"
# Exact apt version, including epoch and distribution suffix; deliberately required.
zabbix_agent_package_version: ""
zabbix_agent_server: ""
zabbix_agent_server_active: "{{ zabbix_agent_server }}"
zabbix_agent_hostname: "{{ inventory_hostname }}"
zabbix_agent_tls_connect: unencrypted
zabbix_agent_tls_accept: unencrypted
zabbix_agent_tls_psk_identity: "{{ inventory_hostname }}"
zabbix_agent_tls_psk: ""
zabbix_agent_tls_ca_file: ""
zabbix_agent_tls_cert_file: ""
zabbix_agent_tls_key_file: ""
# Use a reviewed URL/checksum override only for an officially supported release.
zabbix_agent_repository_deb_url: ""
zabbix_agent_repository_deb_checksum: ""
zabbix_agent_supported_releases:
  Debian: ["11", "12", "13"]
  Ubuntu: ["20.04", "22.04", "24.04"]

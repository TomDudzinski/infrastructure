---
ansible_become_exe: /usr/bin/sudo.ws
ansible_pipelining: false
ansible_local_become_success_timeout: 60
ansible_local_become_strip_preamble: false

qnap_mount_source: "192.168.55.5:/Backup"
qnap_mount_path: "/mnt/qnap-backup"
qnap_mount_fstype: "nfs4"
qnap_mount_options: "rw,vers=4.1,_netdev,nofail,x-systemd.automount,x-systemd.device-timeout=10s"

npm_proxy_hosts_api_url: "http://127.0.0.1:18081/api/nginx/proxy-hosts"
npm_proxy_hosts_api_contract_verified: true

# iza uses a local connection, so the Zabbix agent interface needs its LAN address.
zabbix_agent_ip: 192.168.55.7

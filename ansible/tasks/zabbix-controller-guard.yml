---
- name: Require iza, explicit scope and approved deployment parameters
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.pipe', 'hostname -s') == 'iza'
      - ansible_limit | default('') | length > 0
      - zabbix_deployment_approved | default(false) | bool
      - zabbix_server_ip is match('^192\.168\.55\.([1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$')
      - zabbix_server_ip not in ['192.168.55.0', '192.168.55.255']
    fail_msg: Execute only on iza with approved parameters and an explicit --limit.
  delegate_to: localhost
  become: false
  run_once: true
